server {
    listen __EXTERNAL_WEB_PORT__ default_server;
    server_name _;

    access_log /data/uniden_assistant/logs/frontend/nginx-access.log;
    error_log /data/uniden_assistant/logs/frontend/nginx-error.log warn;

    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Use a Django-safe upstream host. Public deployment hosts may contain
        # characters such as underscores that Django rejects before the view runs.
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias /data/uniden_assistant/media/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}