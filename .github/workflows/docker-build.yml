name: Docker Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for version calculation

      - name: Calculate semantic version
        id: version
        run: |
          version=$(./scripts/version.sh)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (optional)
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (optional)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine moving tags
        id: tags
        run: |
          version="${{ steps.version.outputs.version }}"
          moving_tags=""
          
          if [[ "${version}" == *"-dev"* ]]; then
            # Development build (main branch)
            moving_tags="dev,main,latest"
          elif [[ "${version}" == *"-test"* ]]; then
            # Test build (develop branch)
            moving_tags="test,develop"
          elif [[ "${version}" == *"-rc"* ]]; then
            # Release candidate
            moving_tags="rc"
          else
            # Release build
            moving_tags="latest,stable"
            major_minor=$(echo "${version}" | cut -d. -f1-2)
            moving_tags="${moving_tags},${major_minor}"
          fi
          
          echo "moving_tags=${moving_tags}" >> "$GITHUB_OUTPUT"
          echo "Moving tags: ${moving_tags}"

      - name: Prepare Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME && format('docker.io/{0}/uniden-assistant', secrets.DOCKERHUB_USERNAME) || '' }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.tags.outputs.moving_tags }}

      - name: Build Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: uniden-assistant:${{ steps.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (main/tags)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
