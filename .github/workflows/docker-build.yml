name: Docker Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # tag-release: runs ONLY on push to main.
  # Calculates the next patch version, creates a git tag and
  # pushes it.  The tag push then triggers the build job below,
  # so we intentionally skip the build job for main-branch pushes
  # to avoid running it twice.
  # ─────────────────────────────────────────────────────────────
  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to push tags

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to walk tags

      - name: Calculate next version
        id: version
        run: |
          latest_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v0.0.0")
          latest_version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "${latest_version}"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          next_patch=$((patch + 1))
          next_version="${major}.${minor}.${next_patch}"
          echo "version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next_version}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${latest_tag} → v${next_version}"

      - name: Create and push release tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

  # ─────────────────────────────────────────────────────────────
  # build: runs for every trigger EXCEPT a direct push to main
  # (main-branch merges are handled by tag-release above, which
  # then triggers this job via the new tag).
  # ─────────────────────────────────────────────────────────────
  build:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for version calculation

      - name: Calculate semantic version
        id: version
        run: |
          version=$(./scripts/version.sh)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine moving tags
        id: tags
        run: |
          version="${{ steps.version.outputs.version }}"
          if [[ "${version}" == *"-test"* ]]; then
            moving_tags="test,develop"
          elif [[ "${version}" == *"-rc"* ]]; then
            moving_tags="rc"
          else
            # Clean tag build — this is a real release
            major_minor=$(echo "${version}" | cut -d. -f1-2)
            moving_tags="latest,stable,${major_minor}"
          fi
          echo "moving_tags=${moving_tags}" >> "$GITHUB_OUTPUT"
          echo "Moving tags: ${moving_tags}"

      - name: Prepare Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.tags.outputs.moving_tags }}

      - name: Build Docker image (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: uniden-assistant:${{ steps.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
